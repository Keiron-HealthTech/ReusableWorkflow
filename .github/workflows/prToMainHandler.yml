name: PR to Main Handler

on:
  workflow_call:
    inputs:
      development_pr_number:
        required: true
        type: number
      development_pr_creator:
        required: true
        type: string
      reference_branch:
        required: false
        type: string
        default: "development"
      target_branch:
        required: false
        type: string
        default: "main"
        description: "The target branch for the PR (e.g., main or master)"
      merge_commit_sha:
        required: false
        type: string
        default: ""
        description: >-
          Merge commit of the development PR (github.event.pull_request.merge_commit_sha).
          When empty, falls back to the tip of reference_branch, which is only correct if no
          other PR merged in between. Callers should always pass it.
    secrets:
      personal_access_token:
        required: true
      slack_bot_token:
        required: false

env:
  GITHUB_TOKEN: ${{ secrets.personal_access_token }}

jobs:
  pr_to_main_handler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ${{ inputs.reference_branch }} code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.reference_branch }}
          fetch-depth: 0

      - name: Get the last commit SHA
        id: last_commit
        env:
          MERGE_COMMIT_SHA: ${{ inputs.merge_commit_sha }}
          REF_BRANCH: ${{ inputs.reference_branch }}
        run: |
          set -euo pipefail

          if [ -n "$MERGE_COMMIT_SHA" ]; then
            # Validated before it reaches git: a value starting with "-" would be read as an
            # option by the fetch below. Callers are trusted today, but this is a reusable
            # workflow and the input is whatever each of them wires into it.
            if [[ ! "$MERGE_COMMIT_SHA" =~ ^[0-9a-f]{7,40}$ ]]; then
              echo "::error::merge_commit_sha is not a hexadecimal commit SHA: '${MERGE_COMMIT_SHA}'"
              exit 1
            fi
            sha="$MERGE_COMMIT_SHA"
            # fetch-depth: 0 should already cover it, but a very recent merge may not be in the
            # clone yet, so fetch it explicitly.
            git cat-file -e "${sha}^{commit}" 2>/dev/null || git fetch --no-tags origin "$sha"
          else
            # Back-compat for callers that do not pass merge_commit_sha yet. Only correct when no
            # other PR merged between this PR's merge and the start of this run.
            sha=$(git rev-parse HEAD)
            echo "::warning::merge_commit_sha was not provided; falling back to the tip of ${REF_BRANCH} (${sha}), which may belong to a different PR."
          fi

          echo "Commit to port: $(git log -1 --format='%h %s' "$sha")"
          echo "sha=$sha" >> $GITHUB_OUTPUT

      - name: Extract branch prefix from PR
        id: branch_prefix
        run: |
          branch_name=$(gh pr view ${{ inputs.development_pr_number }} --json headRefName --jq '.headRefName')
          prefix=$(echo "$branch_name" | grep -oE '^[^-]+-[^-]+')
          echo "prefix=$prefix" >> $GITHUB_OUTPUT

      - name: Extract team from branch prefix
        id: team_extract
        run: |
          branch_name=$(gh pr view ${{ inputs.development_pr_number }} --json headRefName --jq '.headRefName')
          echo "Branch name: $branch_name"

          # Extract first segment before first hyphen
          team=$(echo "$branch_name" | grep -oE '^[^-]+' | tr '[:lower:]' '[:upper:]')
          echo "Extracted team: $team"
          echo "team=$team" >> $GITHUB_OUTPUT

          # Set a flag if team was successfully extracted
          if [ -n "$team" ]; then
            echo "has_team=true" >> $GITHUB_OUTPUT
          else
            echo "has_team=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Get PR comments, title and body
        id: pr_details
        run: |
          # Fetch PR data
          pr_data=$(gh pr view ${{ inputs.development_pr_number }} --json title,body,comments)

          # Extract title using heredoc delimiter for safe multiline/special char handling
          pr_title=$(echo "$pr_data" | jq -r '.title // ""')
          {
            echo "title<<EOFTITLE"
            echo "$pr_title"
            echo "EOFTITLE"
          } >> $GITHUB_OUTPUT

          # Extract body (keep original formatting, no <br> conversion needed)
          pr_body=$(echo "$pr_data" | jq -r '.body // ""')
          {
            echo "body<<EOFBODY"
            echo "$pr_body"
            echo "EOFBODY"
          } >> $GITHUB_OUTPUT

          # Extract parent comments
          pr_comments=$(echo "$pr_data" | jq -r '[.comments[]? | select(.body | startswith("/parent")) | .body] | join("\n")')
          {
            echo "comments<<EOFCOMMENTS"
            echo "$pr_comments"
            echo "EOFCOMMENTS"
          } >> $GITHUB_OUTPUT

      - name: Extract parent PR number (if any)
        id: parent_pr_number
        env:
          PR_COMMENTS: ${{ steps.pr_details.outputs.comments }}
        run: |
          # grep will exit 1 if no match found, which is expected behavior
          # continue-on-error: true allows workflow to continue
          # outcome will be 'failure' if no /parent # comment exists
          parent_pr=$(echo "$PR_COMMENTS" | grep -oP '/parent #\K\d+')
          echo "parent_pr=$parent_pr" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Set Git user
        run: |
          git config user.name "$(git log -n 1 --pretty=format:%an)"
          git config user.email "$(git log -n 1 --pretty=format:%ae)"

      - name: Checkout from ${{ inputs.target_branch }} branch
        id: prod_branch
        if: steps.parent_pr_number.outcome == 'failure'
        env:
          PROD_BRANCH: ${{ steps.branch_prefix.outputs.prefix }}-prod
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin "$TARGET_BRANCH"

          # Common case: the prod branch does not exist yet. Matched as a full ref on purpose:
          # a bare name is a pattern that also matches refs/heads/<anything>/<name>, which would
          # send a brand-new branch down the "already exists" path and then fail the fetch below
          # with "couldn't find remote ref".
          if ! git ls-remote --exit-code --heads origin "refs/heads/$PROD_BRANCH" >/dev/null 2>&1; then
            git checkout -b "$PROD_BRANCH" "origin/$TARGET_BRANCH"
            echo "create_pr=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # The branch already exists. Recreating it from the target (the previous behaviour)
          # leaves the local branch with no ancestry to the remote one, so the push is rejected
          # as non-fast-forward. Development branches often share a prefix, so this is frequent.
          git fetch --no-tags origin "$PROD_BRANCH"
          open_pr=$(gh pr list --head "$PROD_BRANCH" --base "$TARGET_BRANCH" --state open --json number --jq '.[0].number // ""')

          if [ -n "$open_pr" ]; then
            # Live branch: exactly the grouping the <prefix>-prod scheme is meant to support.
            echo "Branch $PROD_BRANCH has open PR #${open_pr}; stacking the commit on top of it."
            git checkout -B "$PROD_BRANCH" "origin/$PROD_BRANCH"
            echo "create_pr=false" >> $GITHUB_OUTPUT
            echo "reused_pr=$open_pr" >> $GITHUB_OUTPUT
            exit 0
          fi

          if git merge-base --is-ancestor "origin/$PROD_BRANCH" "origin/$TARGET_BRANCH"; then
            # No open PR and already contained in the target, so it carries no foreign commits
            # and can be restarted from the target. Still a fast-forward push (origin/$PROD_BRANCH
            # is an ancestor of origin/$TARGET_BRANCH, which is an ancestor of the new tip), and
            # cherry-picking onto a fresh base conflicts far less than onto a stale one.
            echo "Branch $PROD_BRANCH has no open PR and is already contained in $TARGET_BRANCH; restarting it from $TARGET_BRANCH."
            git checkout -B "$PROD_BRANCH" "origin/$TARGET_BRANCH"
            echo "create_pr=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Orphan branch carrying its own commits (PR closed without merging). Stacking on top
          # would drag those abandoned commits into a PR to production, so stop here.
          echo "::error::Branch '$PROD_BRANCH' exists on origin, has no open PR against '$TARGET_BRANCH', and carries commits that are not in '$TARGET_BRANCH' (its PR was closed without merging). Stacking on top would drag those commits into production. Delete the branch if it is orphaned, or comment '/parent #<number>' on the development PR to chain onto it explicitly."
          exit 1

      - name: Checkout from parent PR branch
        if: steps.parent_pr_number.outcome != 'failure'
        run: |
          parent_branch=$(gh pr view ${{ steps.parent_pr_number.outputs.parent_pr }} --json headRefName --jq '.headRefName')
          git fetch origin $parent_branch
          git checkout $parent_branch

      - name: Cherry-pick the last commit from ${{ inputs.reference_branch }}
        id: cherry_pick
        env:
          SHA: ${{ steps.last_commit.outputs.sha }}
        run: |
          git cherry-pick -m 1 "$SHA"
        continue-on-error: true

      - name: Commit conflicts if cherry pick fails
        id: conflict_commit
        if: ${{ steps.cherry_pick.outcome == 'failure' }}
        env:
          SHA: ${{ steps.last_commit.outputs.sha }}
        run: |
          set -euo pipefail

          if ! git rev-parse --verify --quiet CHERRY_PICK_HEAD >/dev/null; then
            echo "::error::The cherry-pick of ${SHA} failed before it started, so there is nothing to resolve. See the previous step."
            exit 1
          fi

          # A cherry-pick also exits non-zero when the change is already present ("the previous
          # cherry-pick is now empty"), which leaves no unmerged paths behind. `git commit` would
          # then abort with "nothing to commit" and fail a step named after conflicts. There is
          # simply nothing to port, which is not an error: skip the pick and wind the job down.
          if [ -z "$(git ls-files --unmerged)" ]; then
            echo "::warning::${SHA} is already present on this branch; nothing to port."
            git cherry-pick --skip
            echo "nothing_to_port=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          git add .
          git commit --no-edit

      - name: Push branch
        if: steps.conflict_commit.outputs.nothing_to_port != 'true'
        env:
          # Passed via env instead of interpolated into the script: the branch name comes from the
          # PR and the parent number from a comment, so both are attacker-controllable inputs.
          NO_PARENT: ${{ steps.parent_pr_number.outcome == 'failure' }}
          PROD_BRANCH: ${{ steps.branch_prefix.outputs.prefix }}-prod
          PARENT_PR: ${{ steps.parent_pr_number.outputs.parent_pr }}
        run: |
          set -euo pipefail
          if [ "$NO_PARENT" == "true" ]; then
            git push origin "$PROD_BRANCH"
          else
            parent_branch=$(gh pr view "$PARENT_PR" --json headRefName --jq '.headRefName')
            git push origin "HEAD:$parent_branch"
          fi

      - name: Comment on the reused prod PR
        if: >-
          steps.parent_pr_number.outcome == 'failure'
          && steps.prod_branch.outputs.create_pr == 'false'
          && steps.conflict_commit.outputs.nothing_to_port != 'true'
        env:
          REUSED_PR: ${{ steps.prod_branch.outputs.reused_pr }}
          PR_NUMBER: ${{ inputs.development_pr_number }}
          PR_CREATOR: ${{ inputs.development_pr_creator }}
          PR_TITLE: ${{ steps.pr_details.outputs.title }}
          CHERRY_PICK_FAILED: ${{ steps.cherry_pick.outcome == 'failure' }}
        run: |
          set -euo pipefail
          {
            echo "Added to this branch: the change from #${PR_NUMBER} by @${PR_CREATOR} — ${PR_TITLE}"
            echo ""
            echo "It was stacked here instead of opening a new PR because it shares the branch prefix."
            if [ "$CHERRY_PICK_FAILED" == "true" ]; then
              echo ""
              echo ":warning: **The cherry-pick hit conflicts and was committed as-is. Review the result before merging.**"
            fi
          } > /tmp/reuse_comment.md
          gh pr comment "$REUSED_PR" --body-file /tmp/reuse_comment.md

      - name: Create pull request
        if: >-
          steps.parent_pr_number.outcome == 'failure'
          && steps.prod_branch.outputs.create_pr == 'true'
          && steps.conflict_commit.outputs.nothing_to_port != 'true'
        env:
          PR_TITLE: ${{ steps.pr_details.outputs.title }}
          PR_BODY: ${{ steps.pr_details.outputs.body }}
          PR_NUMBER: ${{ inputs.development_pr_number }}
          PR_CREATOR: ${{ inputs.development_pr_creator }}
          BRANCH_PREFIX: ${{ steps.branch_prefix.outputs.prefix }}
          LAST_COMMIT: ${{ steps.last_commit.outputs.sha }}
          REF_BRANCH: ${{ inputs.reference_branch }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          CHERRY_PICK_FAILED: ${{ steps.cherry_pick.outcome == 'failure' }}
        run: |
          # Build the title (safe - passed via env var)
          FULL_TITLE="[Prod] ${PR_TITLE} - #${PR_NUMBER} by @${PR_CREATOR}"

          # Build the body and write to temp file to avoid shell escaping issues
          if [ "$CHERRY_PICK_FAILED" == "true" ]; then
            {
              echo ":warning: **This PR had conflicts with ${TARGET_BRANCH}. Make sure the changes are correct before proceeding.**"
              echo ""
              echo "---"
              echo ""
              echo "**Original PR Description:**"
              echo ""
              echo "$PR_BODY"
              echo ""
              echo "---"
              echo "This PR includes changes from commit ${LAST_COMMIT}, PR #${PR_NUMBER} in ${REF_BRANCH}."
            } > /tmp/pr_body.md
          else
            {
              echo "**Original PR Description:**"
              echo ""
              echo "$PR_BODY"
              echo ""
              echo "---"
              echo "This PR includes changes from commit ${LAST_COMMIT}, PR #${PR_NUMBER} in ${REF_BRANCH}."
            } > /tmp/pr_body.md
          fi

          # Create the PR using --body-file to avoid shell escaping issues
          gh pr create \
            -B "$TARGET_BRANCH" \
            -H "${BRANCH_PREFIX}-prod" \
            --title "$FULL_TITLE" \
            --body-file /tmp/pr_body.md \
            --assignee "$PR_CREATOR" \
            --draft

      - name: Determine Slack channel for team
        id: slack_channel
        if: failure() && steps.team_extract.outputs.has_team == 'true'
        env:
          SLACK_TOKEN: ${{ secrets.slack_bot_token }}
          TEAM: ${{ steps.team_extract.outputs.team }}
        run: |
          # Check if Slack token is provided
          if [ -z "$SLACK_TOKEN" ]; then
            echo "No Slack bot token provided, skipping notification"
            echo "has_channel=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANNEL=""

          case "$TEAM" in
            "CRM")
              CHANNEL="crm-dev"
              ;;
            # Add more team-to-channel mappings here as needed:
            # "SALES")
            #   CHANNEL="sales-team"
            #   ;;
            *)
              echo "No channel mapping configured for team: $TEAM"
              ;;
          esac

          if [ -n "$CHANNEL" ]; then
            echo "channel=$CHANNEL" >> $GITHUB_OUTPUT
            echo "has_channel=true" >> $GITHUB_OUTPUT
          else
            echo "has_channel=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Send Slack notification on failure
        if: failure() && steps.slack_channel.outputs.has_channel == 'true'
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.slack_bot_token }}
          payload: |
            {
              "channel": "${{ steps.slack_channel.outputs.channel }}",
              "text": "PR to Main Workflow Failed - Team ${{ steps.team_extract.outputs.team }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "❌ PR to Main Workflow Failed",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Team:*\n${{ steps.team_extract.outputs.team }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*PR Number:*\n<${{ github.server_url }}/${{ github.repository }}/pull/${{ inputs.development_pr_number }}|#${{ inputs.development_pr_number }}>"
                    }
                  ]
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Creator:*\n@${{ inputs.development_pr_creator }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\n${{ steps.branch_prefix.outputs.prefix }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*PR Title:*\n${{ steps.pr_details.outputs.title }}"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "style": "danger",
                      "text": {
                        "type": "plain_text",
                        "text": "View Failed Workflow Run",
                        "emoji": true
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    },
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Original PR",
                        "emoji": true
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/pull/${{ inputs.development_pr_number }}"
                    }
                  ]
                }
              ]
            }
        continue-on-error: true
