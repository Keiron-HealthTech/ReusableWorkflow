name: Build image and publish to ECR

on:
  workflow_call:
    inputs:
      image_repository_name:
        required: true
        type: string
      runner:
        required: true
        type: string
      environment:
        type: string
        default: ""
      dockerfile:
        type: string
        default: "Dockerfile"
      prefix:
        type: string
        default: ""
      cluster:
        description: "Target cluster: 'production' or 'staging'. If not set, uses legacy AWS credentials."
        type: string
        default: ""
      cache_backend:
        description: "Where BuildKit keeps its layer cache: 'gha' (GitHub Actions cache, 10 GB per repository) or 'registry' (a buildcache tag in the image's ECR repository)."
        type: string
        default: "gha"
    outputs:
      image_uri:
        description: "The URI of the Docker image that was built and pushed to Amazon ECR"
        value: ${{ jobs.build.outputs.image_uri }}

jobs:
  build:
    runs-on: ${{inputs.runner}}
    environment: ${{ inputs.environment || null }}
    outputs:
      image_uri: ${{ steps.set-outputs.outputs.image_uri }}
    steps:
      - name: Clone
        uses: actions/checkout@v7

      - name: set job env
        run: |
          echo "TAG=${GITHUB_REF_NAME////_}" >> $GITHUB_ENV
          echo "SHORT_SHA=`echo ${GITHUB_SHA} | cut -c 1-8`" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@v4
        continue-on-error: true

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configure AWS credentials (OIDC)
        if: inputs.cluster != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.cluster == 'production' && vars.APP_DEPLOY_ROLE_ARN_PRODUCTION || vars.APP_DEPLOY_ROLE_ARN_STAGING }}
          aws-region: us-east-1

      - name: Configure AWS credentials (Legacy)
        if: inputs.cluster == ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # The GitHub Actions cache is capped at 10 GB per repository; once full, it
      # evicts blobs that a scope's index still points to and the build starts
      # from scratch. A buildcache tag in ECR has no such cap. The ref carries the
      # branch so that staging and production builds do not overwrite each other.
      - name: Select BuildKit cache
        id: cache
        env:
          CACHE_BACKEND: ${{ inputs.cache_backend }}
          CACHE_REF: ${{ steps.login-ecr.outputs.registry }}/${{ inputs.image_repository_name }}:buildcache-${{ env.TAG }}-${{ inputs.prefix || 'default' }}
          GHA_SCOPE: ${{ inputs.prefix || inputs.image_repository_name }}
        run: |
          case "$CACHE_BACKEND" in
            registry)
              echo "from=type=registry,ref=$CACHE_REF" >> "$GITHUB_OUTPUT"
              echo "to=type=registry,ref=$CACHE_REF,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true" >> "$GITHUB_OUTPUT"
              ;;
            gha)
              echo "from=type=gha,scope=$GHA_SCOPE" >> "$GITHUB_OUTPUT"
              echo "to=type=gha,mode=max,scope=$GHA_SCOPE" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::cache_backend must be 'gha' or 'registry', got '$CACHE_BACKEND'"
              exit 1
              ;;
          esac

      - name: Build, tag, and push image to Amazon ECR (BuildKit)
        if: steps.setup-buildx.outcome == 'success'
        id: build-image-buildkit
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.image_repository_name }}:latest-${{ env.TAG }}-${{ inputs.prefix }}
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.image_repository_name }}:${{ env.TAG }}-${{ inputs.prefix }}-${{ env.SHORT_SHA }}
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}

      - name: Build, tag, and push image to Amazon ECR (Legacy)
        if: steps.setup-buildx.outcome != 'success'
        id: build-image-legacy
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker image build \
            --tag ${{ env.ECR_REGISTRY }}/${{ inputs.image_repository_name }}:latest-${TAG}-${{ inputs.prefix }} \
            --tag ${{ env.ECR_REGISTRY }}/${{ inputs.image_repository_name }}:${TAG}-${{ inputs.prefix }}-${SHORT_SHA} \
            -f ${{ inputs.dockerfile }} \
            .
          docker push ${{ env.ECR_REGISTRY }}/${{ inputs.image_repository_name }} --all-tags

      - name: Set Outputs
        id: set-outputs
        run: echo "image_uri=${{ steps.login-ecr.outputs.registry }}/${{inputs.image_repository_name}}:${TAG}-${{inputs.prefix}}-${SHORT_SHA}" >> $GITHUB_OUTPUT
